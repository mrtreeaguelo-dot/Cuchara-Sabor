<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="refresh" content="0; url=./web/index.html">
    <title>Cuchara & Sabor - Redirigiendo...</title>
    <style>
        body {
            background: #FCFAF5;
            color: #D35400;
            font-family: 'Outfit', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #D35400;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
    <script>
        // Redirección inmediata por JavaScript
        window.location.replace("./web/index.html");
    </script>
</head>
<body>
    <div>
        <div class="loader" style="margin: 0 auto 20px;"></div>
        <p>Redirigiendo a <strong>Cuchara & Sabor</strong>...</p>
        <p style="font-size: 0.8rem; opacity: 0.7;">Si no eres redirigido, <a href="./web/index.html" style="color: #D35400;">haz clic aquí</a>.</p>
    </div>
</body>
</html>
